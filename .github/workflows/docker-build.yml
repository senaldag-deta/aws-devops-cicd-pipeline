name: Docker Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aws-devops-flask:test .
      - name: Test Flask application
        run: |
          docker run -d -p 5000:5000 --name flask-test aws-devops-flask:test
          for i in {1..10}; do
            if curl --fail --silent http://localhost:5000/health | grep -q '"status":"healthy"'; then
              echo "Flask health check passed!"
              exit 0
            fi
            sleep 2
          done
          echo "Flask health check failed!"
          docker logs flask-test
          exit 1
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Push Docker image to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          
          docker tag aws-devops-flask:test ghcr.io/senaldag-deta/aws-devops-cicd-pipeline:latest
          docker tag aws-devops-flask:test ghcr.io/senaldag-deta/aws-devops-cicd-pipeline:${GITHUB_SHA::7}
          docker push ghcr.io/senaldag-deta/aws-devops-cicd-pipeline:latest
          docker push ghcr.io/senaldag-deta/aws-devops-cicd-pipeline:${GITHUB_SHA::7}

